<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(
          circle at top,
          #3b82f6 0%,
          #1e293b 55%,
          #0f172a 100%
        );
      }

      .app-container {
        width: min(100%, 680px);
        background: rgba(255, 255, 255, 0.97);
        border-radius: 28px;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
        padding: 32px 36px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        backdrop-filter: blur(12px);
      }

      .chat-input-container {
        display: flex;
        gap: 12px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.12),
          rgba(79, 70, 229, 0.1)
        );
        padding: 12px 14px;
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .chat-input {
        flex: 1;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        line-height: 1.5;
        color: #0f172a;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .chat-input::placeholder {
        color: #94a3b8;
      }

      .chat-input:focus {
        outline: none;
        border-color: rgba(37, 99, 235, 0.75);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      }

      .send-button {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #f8fafc;
        padding: 14px 26px;
        border: none;
        border-radius: 14px;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 12px 25px rgba(34, 197, 94, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .send-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 30px rgba(34, 197, 94, 0.28);
      }

      .send-button:active {
        transform: translateY(0);
        box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
      }

      .chat-message {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        padding: 16px 20px;
        border-radius: 22px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
        font-size: 16px;
        line-height: 1.5;
        max-width: 75%;
        background: rgba(226, 232, 240, 0.85);
        color: #0f172a;
      }

      .chat-message + .chat-message {
        margin-top: -8px;
      }

      .chat-message.bot {
        background: linear-gradient(
          135deg,
          rgba(96, 165, 250, 0.9),
          rgba(129, 140, 248, 0.9)
        );
        color: #0b1120;
      }

      .chat-message.user {
        margin-left: auto;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #e0f2fe;
        justify-content: flex-end;
      }

      .chat-message img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.35);
        background: rgba(255, 255, 255, 0.7);
        padding: 3px;
      }

      .chat-message.user img {
        order: 2;
      }

      @media (max-width: 640px) {
        body {
          padding: 32px 12px;
        }

        .app-container {
          padding: 28px 22px;
          border-radius: 22px;
        }

        .chat-message {
          max-width: 85%;
          font-size: 15px;
        }

        .send-button {
          padding: 12px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              id: crypto.randomUUID(),
              message: inputText,
              sender: "user",
            },
          ];
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              id: crypto.randomUUID(),
              message: response,
              sender: "bot",
            },
          ]);
          setInputText("");
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Enter the message here!"
              size="30"
              onChange={saveInputText}
              className="chat-input"
              value={inputText}
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        //const message = props.message;
        //const {message} = props;
        //const sender = props.sender;
        //const {message, sender} = props;

        /*
        if(sender === "bot"){
          return(
            <div>
              {message}
              <img src="../bot.png" width="50"/>
            </div>
          );
        }
          */
        return (
          <div
            className={
              sender === "user" ? "chat-message user" : "chat-message bot"
            }
          >
            {sender === "bot" && <img src="../bot.png" width="50" />}
            {message}
            {sender === "user" && <img src="../user.png" width="50" />}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        //const chatMessage = array[0];
        //const setChatMessage = array[1];

        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  key={chatMessage.id}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              );
            })}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            id: "id1",
            message: "First message",
            sender: "user",
          },
          {
            id: "id2",
            message: "Second message",
            sender: "bot",
          },
          {
            id: "id3",
            message: "Third message",
            sender: "user",
          },
          {
            id: "id4",
            message: "Fourth message",
            sender: "bot",
          },
        ]);

        return (
          <div className="app-container">
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
