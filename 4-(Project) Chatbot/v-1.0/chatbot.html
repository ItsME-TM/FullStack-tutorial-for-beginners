<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input placeholder="Enter the message here!" size="30" />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        //const message = props.message;
        //const {message} = props;
        //const sender = props.sender;
        //const {message, sender} = props;

        /*
        if(sender === "bot"){
          return(
            <div>
              {message}
              <img src="../bot.png" width="50"/>
            </div>
          );
        }
          */
        return (
          <div>
            {sender === "bot" && <img src="../bot.png" width="50" />}
            {message}
            {sender === "user" && <img src="../user.png" width="50" />}
          </div>
        );
      }

      function App(){
        return(
          <>
            <ChatInput />
            <ChatMessage message="First message" sender="user" />
            <ChatMessage message="Second message" sender="bot" />
            <ChatMessage message="Third message" sender="user" />
            <ChatMessage message="Fourth message" sender="bot" />
          </>
      );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
